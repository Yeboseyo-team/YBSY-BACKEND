name: 🐛 버그
description: 버그를 제보해요
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 어떤 문제인가요?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
  - type: textarea
    id: screenshot
    attributes:
      label: 스크린샷 / 에러 로그
