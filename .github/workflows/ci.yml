name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 아직 프로젝트(package.json)가 없을 땐 아래 단계들을 건너뛰고 통과해요
      - name: Check project exists
        id: check
        run: |
          if [ -f package.json ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; echo "package.json 없음 - 건너뜀"; fi

      - uses: pnpm/action-setup@v4
        if: steps.check.outputs.exists == 'true'

      - uses: actions/setup-node@v5
        if: steps.check.outputs.exists == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        if: steps.check.outputs.exists == 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: steps.check.outputs.exists == 'true'
        run: pnpm run --if-present lint

      - name: Typecheck
        if: steps.check.outputs.exists == 'true'
        run: pnpm run --if-present typecheck

      - name: Test
        if: steps.check.outputs.exists == 'true'
        run: pnpm run --if-present test

      - name: Build
        if: steps.check.outputs.exists == 'true'
        run: pnpm run build
