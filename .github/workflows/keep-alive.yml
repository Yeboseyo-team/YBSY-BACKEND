name: Supabase 깨우기

# Supabase 무료 프로젝트는 한동안 DB 요청이 없으면 자동으로 멈춥니다.
# 발표(10/27)까지 멈추지 않도록 매일 한 번 아주 작은 조회를 보냅니다.
# - 공개해도 되는 publishable 키만 씁니다 (레포 Settings → Secrets and variables → Actions 에 등록)
# - certificates 는 로그인 사용자만 볼 수 있어 결과는 빈 목록([])이지만, DB 조회 자체가 일어나므로 "활동"으로 셉니다
# - 예약 실행(schedule)은 GitHub 규칙상 기본 브랜치(main)에 이 파일이 있어야 동작합니다

on:
  schedule:
    - cron: "0 0 * * *" # 매일 00:00 UTC = 한국 시간 오전 9시
  workflow_dispatch: # Actions 화면에서 "Run workflow" 로 바로 실행

permissions:
  contents: read

jobs:
  ping:
    name: DB 조회 1회
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Supabase REST 로 자격증 1줄 조회
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::레포 Secrets 에 SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY 를 등록하세요."
            exit 1
          fi
          for attempt in 1 2 3; do
            code=$(curl -s -o /tmp/body.json -w "%{http_code}" \
              -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
              "$SUPABASE_URL/rest/v1/certificates?select=id&limit=1")
            echo "시도 $attempt: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "DB 가 깨어 있어요."
              exit 0
            fi
            sleep 20
          done
          echo "::error::Supabase 응답이 200 이 아니에요 (마지막 HTTP $code). 대시보드에서 프로젝트가 멈췄는지(Paused) 확인하세요."
          cat /tmp/body.json || true
          exit 1
