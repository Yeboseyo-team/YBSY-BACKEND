<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인증 처리 실패 (PC)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2B55B3}a:hover{color:#1E3F8A}
</style>
</head>
<body>
<div style="min-height: 100vh; display: flex; flex-direction: column; background: #F5F7FA; color: #17233B; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif">
  <header style="width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 32px; box-sizing: border-box; height: 72px; display: flex; align-items: center">
    <a href="PcLogin.html" style="font-size: 18px; font-weight: 700; letter-spacing: -0.02em; color: #17233B; text-decoration: none">학기예보</a>
  </header>
  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px 24px 96px">
    <div style="width: 100%; max-width: 460px; box-sizing: border-box; background: #FFFFFF; border: 1px solid #DCE2EA; border-radius: 24px; padding: 40px; display: flex; flex-direction: column; gap: 24px">
      <div aria-hidden="true" style="width: 64px; height: 64px; border-radius: 20px; background: #E8EDF4; display: flex; align-items: center; justify-content: center">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#4A5872" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17a4 4 0 0 1-.6-7.96A5.5 5.5 0 0 1 17 8.5a3.5 3.5 0 0 1 .5 6.96"></path><path d="M10 13l4 4M14 13l-4 4"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px">
        <h1 style="margin: 0; font-size: 28px; line-height: 1.3; font-weight: 700; letter-spacing: -0.03em">로그인을 마치지 못했어요</h1>
        <p style="margin: 0; font-size: 15px; line-height: 1.65; color: #4A5872">링크가 만료되었거나 이미 사용되었어요. 가입이나 로그인을 진행한 브라우저에서 링크를 열어 주세요.</p>
      </div>
      <p style="margin: 0; padding: 14px 16px; border-radius: 12px; background: #F5F7FA; font-size: 14px; line-height: 1.6; color: #4A5872">휴대폰으로 가입하고 PC에서 메일을 열면 이 화면이 나와요. 가입한 기기에서 다시 열거나, 인증 메일을 새로 받으세요.</p>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <a href="PcLogin.html" style="height: 50px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: #17233B; color: #FFFFFF; font-size: 15px; font-weight: 600; text-decoration: none">로그인 화면으로</a>
        <a href="PcCheckEmail.html" style="height: 44px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600">인증 메일 새로 받기</a>
      </div>
    </div>
  </main>
</div>
</body>
</html>
