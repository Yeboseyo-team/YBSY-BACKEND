<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자격증 선택 (PC)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2B55B3}a:hover{color:#1E3F8A}
</style>
</head>
<body>
<div style="min-height: 100vh; background: #F5F7FA; color: #17233B; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif">

  <header style="background: #FFFFFF; border-bottom: 1px solid #DCE2EA">
    <div style="max-width: 1200px; margin: 0 auto; padding: 10px 32px; box-sizing: border-box; min-height: 64px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 32px">
      <a href="index.html" style="font-size: 18px; font-weight: 700; letter-spacing: -0.02em; color: #17233B; text-decoration: none">학기예보</a>
      <nav aria-label="주요 메뉴" style="display: flex; gap: 4px">
        <a href="index.html" style="height: 40px; padding: 0 14px; display: inline-flex; align-items: center; border-radius: 10px; color: #4A5872; font-size: 15px; text-decoration: none">예보</a>
        <a href="PcPlanList.html" style="height: 40px; padding: 0 14px; display: inline-flex; align-items: center; border-radius: 10px; color: #4A5872; font-size: 15px; text-decoration: none">계획</a>
        <a href="PcMyCertificates.html" aria-current="page" style="height: 40px; padding: 0 14px; display: inline-flex; align-items: center; border-radius: 10px; background: #E8EDF4; color: #17233B; font-size: 15px; font-weight: 600; text-decoration: none">자격증</a>
      </nav>
      <div style="margin-left: auto; display: flex; align-items: center">
        <a href="PcSettings.html" aria-label="설정" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 10px; color: #17233B"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"></path><circle cx="15" cy="7" r="2"></circle><circle cx="9" cy="17" r="2"></circle></svg></a>
      </div>
    </div>
  </header>

  <main style="max-width: 1200px; margin: 0 auto; padding: 32px 32px 64px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.03em">자격증</h1>
      <p style="margin: 0; font-size: 15px; color: #4A5872">회차를 고르면 접수·시험 일정과 준비 기간이 예보에 들어가요.</p>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">

      <section aria-label="자격증 검색" style="flex: 1 1 300px; min-width: 0; max-width: 380px; display: flex; flex-direction: column; gap: 12px">
        <div style="position: relative">
          <label for="pc-cert-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">자격증 검색</label>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A6780" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="position: absolute; left: 14px; top: 15px"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
          <input id="pc-cert-search" type="search" value="정보처리" style="width: 100%; height: 48px; box-sizing: border-box; padding: 0 14px 0 42px; border: 1px solid #C9D2DE; border-radius: 12px; background: #FFFFFF; color: #17233B; font: inherit; font-size: 15px">
        </div>
        <span style="font-size: 13px; color: #5A6780">검색 결과 2개</span>
        <button type="button" aria-pressed="true" style="display: flex; align-items: center; justify-content: space-between; min-height: 64px; padding: 0 16px; border: 2px solid #17233B; border-radius: 14px; background: #FFFFFF; color: #17233B; font: inherit; text-align: left">
          <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">정보처리기사</span><span style="font-size: 13px; color: #5A6780">한국산업인력공단</span></span>
          <span style="font-size: 12px; font-weight: 700; color: #A82E27">마감 D-3</span>
        </button>
        <button type="button" aria-pressed="false" style="display: flex; align-items: center; justify-content: space-between; min-height: 64px; padding: 0 16px; border: 1px solid #DCE2EA; border-radius: 14px; background: #FFFFFF; color: #17233B; font: inherit; text-align: left">
          <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">정보처리산업기사</span><span style="font-size: 13px; color: #5A6780">한국산업인력공단</span></span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A95A8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        </button>
      </section>

      <section aria-labelledby="pc-cert-name" style="flex: 999 1 560px; min-width: 0; background: #FFFFFF; border: 1px solid #DCE2EA; border-radius: 20px; padding: 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
        <div style="display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px">
          <div style="display: flex; flex-direction: column; gap: 4px">
            <h2 id="pc-cert-name" style="margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.02em">정보처리기사</h2>
            <span style="font-size: 14px; color: #5A6780">한국산업인력공단</span>
          </div>
          <span style="display: inline-flex; align-items: center; height: 30px; padding: 0 12px; border-radius: 999px; background: #FBE7E5; color: #A82E27; font-size: 13px; font-weight: 700">접수 마감 D-3</span>
        </div>

        <fieldset style="margin: 0; padding: 0; border: 0">
          <legend style="padding: 0; margin-bottom: 10px; font-size: 14px; font-weight: 600">회차</legend>
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px">
            <label style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 14px; border: 1px solid #EDF0F5; border-radius: 12px; background: #F5F7FA; color: #8A95A8">
              <input type="radio" name="pc-round" disabled="" style="width: 18px; height: 18px; margin: 0">
              <span style="flex: 1; font-size: 15px">정기 2회</span><span style="font-size: 13px">접수 마감됨</span>
            </label>
            <label style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 14px; border: 1.5px solid #3F6FD8; border-radius: 12px; background: #EEF3FD">
              <input type="radio" name="pc-round" checked="" style="width: 18px; height: 18px; margin: 0; accent-color: #3F6FD8">
              <span style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 15px; font-weight: 600">정기 3회</span><span style="font-size: 13px; color: #4A5872">시험 8주차, D-40</span></span>
            </label>
          </div>
        </fieldset>

        <div style="display: flex; flex-direction: column; gap: 10px">
          <h3 style="margin: 0; font-size: 14px; font-weight: 600">이번 학기에서 차지하는 기간</h3>
          <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 4px">
            
              <span style="height: 28px; border-radius: 6px; background: #EDF0F5; box-shadow: none"></span>
            
              <span style="height: 28px; border-radius: 6px; background: #EDF0F5; box-shadow: none"></span>
            
              <span style="height: 28px; border-radius: 6px; background: #B9CEF5; box-shadow: inset 0 0 0 2px #17233B"></span>
            
              <span style="height: 28px; border-radius: 6px; background: #B9CEF5; box-shadow: none"></span>
            
              <span style="height: 28px; border-radius: 6px; background: #B9CEF5; box-shadow: none"></span>
            
              <span style="height: 28px; border-radius: 6px; background: #B9CEF5; box-shadow: none"></span>
            
              <span style="height: 28px; border-radius: 6px; background: #B9CEF5; box-shadow: none"></span>
            
              <span style="height: 28px; border-radius: 6px; background: #3F6FD8; box-shadow: none"></span>
            
              <span style="height: 28px; border-radius: 6px; background: #EDF0F5; box-shadow: none"></span>
            
              <span style="height: 28px; border-radius: 6px; background: #EDF0F5; box-shadow: none"></span>
            
              <span style="height: 28px; border-radius: 6px; background: #EDF0F5; box-shadow: none"></span>
            
              <span style="height: 28px; border-radius: 6px; background: #EDF0F5; box-shadow: none"></span>
            
              <span style="height: 28px; border-radius: 6px; background: #EDF0F5; box-shadow: none"></span>
            
              <span style="height: 28px; border-radius: 6px; background: #EDF0F5; box-shadow: none"></span>
            
              <span style="height: 28px; border-radius: 6px; background: #EDF0F5; box-shadow: none"></span>
            
              <span style="height: 28px; border-radius: 6px; background: #EDF0F5; box-shadow: none"></span>
            
          </div>
          <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 4px; font-size: 12px">
            
              <span style="text-align: center; white-space: nowrap; color: #6B7891; font-weight: 400">1주</span>
            
              <span style="text-align: center; white-space: nowrap; color: #6B7891; font-weight: 400"></span>
            
              <span style="text-align: center; white-space: nowrap; color: #17233B; font-weight: 700">이번 주</span>
            
              <span style="text-align: center; white-space: nowrap; color: #6B7891; font-weight: 400"></span>
            
              <span style="text-align: center; white-space: nowrap; color: #6B7891; font-weight: 400"></span>
            
              <span style="text-align: center; white-space: nowrap; color: #6B7891; font-weight: 400"></span>
            
              <span style="text-align: center; white-space: nowrap; color: #6B7891; font-weight: 400"></span>
            
              <span style="text-align: center; white-space: nowrap; color: #17233B; font-weight: 700">시험</span>
            
              <span style="text-align: center; white-space: nowrap; color: #6B7891; font-weight: 400"></span>
            
              <span style="text-align: center; white-space: nowrap; color: #6B7891; font-weight: 400"></span>
            
              <span style="text-align: center; white-space: nowrap; color: #6B7891; font-weight: 400"></span>
            
              <span style="text-align: center; white-space: nowrap; color: #6B7891; font-weight: 400"></span>
            
              <span style="text-align: center; white-space: nowrap; color: #6B7891; font-weight: 400"></span>
            
              <span style="text-align: center; white-space: nowrap; color: #6B7891; font-weight: 400"></span>
            
              <span style="text-align: center; white-space: nowrap; color: #6B7891; font-weight: 400"></span>
            
              <span style="text-align: center; white-space: nowrap; color: #6B7891; font-weight: 400">16주</span>
            
          </div>
          <p style="margin: 0; font-size: 14px; color: #4A5872">3주차(이번 주)부터 8주차 시험까지 6주 동안 한 주 8시간씩 예보에 더해져요.</p>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border-radius: 14px; background: #F5F7FA">
            <span id="pc-prep" style="font-size: 14px; color: #4A5872">준비 기간</span>
            <div role="group" aria-labelledby="pc-prep" style="display: flex; align-items: center; gap: 12px">
              <button type="button" aria-label="준비 기간 줄이기" style="width: 44px; height: 44px; border: 1px solid #C9D2DE; border-radius: 10px; background: #FFFFFF; color: #17233B; font: inherit; font-size: 18px">−</button>
              <span style="min-width: 44px; text-align: center; font-size: 17px; font-weight: 700">6주</span>
              <button type="button" aria-label="준비 기간 늘리기" style="width: 44px; height: 44px; border: 1px solid #C9D2DE; border-radius: 10px; background: #FFFFFF; color: #17233B; font: inherit; font-size: 18px">+</button>
            </div>
          </div>
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border-radius: 14px; background: #F5F7FA">
            <span id="pc-study" style="font-size: 14px; color: #4A5872">한 주 공부 시간</span>
            <div role="group" aria-labelledby="pc-study" style="display: flex; align-items: center; gap: 12px">
              <button type="button" aria-label="공부 시간 줄이기" style="width: 44px; height: 44px; border: 1px solid #C9D2DE; border-radius: 10px; background: #FFFFFF; color: #17233B; font: inherit; font-size: 18px">−</button>
              <span style="min-width: 44px; text-align: center; font-size: 17px; font-weight: 700">8시간</span>
              <button type="button" aria-label="공부 시간 늘리기" style="width: 44px; height: 44px; border: 1px solid #C9D2DE; border-radius: 10px; background: #FFFFFF; color: #17233B; font: inherit; font-size: 18px">+</button>
            </div>
          </div>
        </div>

        <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding-top: 20px; border-top: 1px solid #EDF0F5">
          <p style="margin: 0; font-size: 13px; color: #4A5872">최종 일정은 시행 기관에서 확인하세요. <a href="https://www.q-net.or.kr" style="font-weight: 600">공고 보기</a></p>
          <div style="display: flex; gap: 8px">
            <a href="PcPlan.html" style="height: 48px; padding: 0 20px; display: inline-flex; align-items: center; border: 1px solid #C9D2DE; border-radius: 12px; color: #17233B; font-size: 15px; font-weight: 600; text-decoration: none">사전 검토</a>
            <a href="PcMyCertificates.html" style="height: 48px; padding: 0 24px; display: inline-flex; align-items: center; border-radius: 12px; background: #17233B; color: #FFFFFF; font-size: 15px; font-weight: 600; text-decoration: none">추가하기</a>
          </div>
        </div>
      </section>
    </div>
  </main>
</div>
</body>
</html>
