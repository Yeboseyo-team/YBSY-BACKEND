<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인증 메일 안내 (PC)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2B55B3}a:hover{color:#1E3F8A}
</style>
</head>
<body>
<div style="min-height: 100vh; display: flex; flex-direction: column; background: #F5F7FA; color: #17233B; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif">
  <header style="width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 32px; box-sizing: border-box; height: 72px; display: flex; align-items: center">
    <a href="PcLogin.html" style="font-size: 18px; font-weight: 700; letter-spacing: -0.02em; color: #17233B; text-decoration: none">학기예보</a>
  </header>
  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px 24px 96px">
    <div style="width: 100%; max-width: 460px; box-sizing: border-box; background: #FFFFFF; border: 1px solid #DCE2EA; border-radius: 24px; padding: 40px; display: flex; flex-direction: column; gap: 24px">
      <div aria-hidden="true" style="width: 64px; height: 64px; border-radius: 20px; background: #E6EEFC; display: flex; align-items: center; justify-content: center">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#2B55B3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"></rect><path d="M3.5 7l8.5 6 8.5-6"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px">
        <h1 style="margin: 0; font-size: 28px; line-height: 1.3; font-weight: 700; letter-spacing: -0.03em">메일함을 확인하세요</h1>
        <p style="margin: 0; font-size: 15px; line-height: 1.65; color: #4A5872"><strong style="color: #17233B; font-weight: 600">you@university.ac.kr</strong> 로 인증 메일을 보냈어요. 메일의 링크를 누르면 가입이 끝나고 바로 로그인돼요.</p>
      </div>
      <ul style="margin: 0; padding: 0 0 0 18px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; line-height: 1.55; color: #4A5872">
        <li>메일이 보이지 않으면 스팸함을 확인하세요.</li>
        <li>링크는 가입한 이 브라우저에서 열어야 해요.</li>
        <li>이미 가입한 이메일이라면 로그인하거나 비밀번호를 재설정하세요.</li>
      </ul>
      <div role="status" style="display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-radius: 12px; background: #E6EEFC; font-size: 14px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2B55B3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>
        인증 메일을 다시 보냈어요.
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <button type="button" style="height: 50px; border: 1px solid #C9D2DE; border-radius: 12px; background: #FFFFFF; color: #17233B; font: inherit; font-size: 15px; font-weight: 600">인증 메일 다시 보내기</button>
        <a href="PcLogin.html" style="height: 44px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600">로그인 화면으로 돌아가기</a>
      </div>
    </div>
  </main>
</div>
</body>
</html>
