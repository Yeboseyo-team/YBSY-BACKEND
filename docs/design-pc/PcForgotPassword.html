<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>비밀번호 찾기 (PC)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2B55B3}a:hover{color:#1E3F8A}
</style>
</head>
<body>
<div style="min-height: 100vh; display: flex; flex-direction: column; background: #F5F7FA; color: #17233B; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif">
  <header style="width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 32px; box-sizing: border-box; height: 72px; display: flex; align-items: center">
    <a href="PcLogin.html" style="font-size: 18px; font-weight: 700; letter-spacing: -0.02em; color: #17233B; text-decoration: none">학기예보</a>
  </header>
  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px 24px 96px">
    <div style="width: 100%; max-width: 460px; box-sizing: border-box; background: #FFFFFF; border: 1px solid #DCE2EA; border-radius: 24px; padding: 40px; display: flex; flex-direction: column; gap: 24px">
      <a href="PcLogin.html" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 4px; min-height: 32px; margin: -12px 0 -8px; font-size: 14px; color: #4A5872; text-decoration: none">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
        로그인으로
      </a>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.03em">비밀번호 재설정</h1>
        <p style="margin: 0; font-size: 15px; line-height: 1.65; color: #4A5872">가입한 이메일을 입력하면 새 비밀번호를 정할 수 있는 링크를 보내 드려요.</p>
      </div>
      <form style="display: flex; flex-direction: column; gap: 16px">
        <div style="display: flex; flex-direction: column; gap: 8px">
          <label for="pcf-email" style="font-size: 14px; font-weight: 600">이메일</label>
          <input id="pcf-email" type="email" value="you@university.ac.kr" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #C9D2DE; border-radius: 12px; background: #FFFFFF; color: #17233B; font: inherit; font-size: 15px">
        </div>
        <a href="PcResetPassword.html" style="height: 50px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: #17233B; color: #FFFFFF; font-size: 15px; font-weight: 600; text-decoration: none">재설정 링크 보내기</a>
      </form>
      <div role="status" style="display: flex; gap: 10px; padding: 14px; border-radius: 12px; background: #E6EEFC; font-size: 14px; line-height: 1.55">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2B55B3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px"><rect x="3" y="5" width="18" height="14" rx="2.5"></rect><path d="M3.5 7l8.5 6 8.5-6"></path></svg>
        <span>가입된 계정이 있으면 재설정 링크가 도착해요. 링크는 이 브라우저에서 열어 주세요.</span>
      </div>
    </div>
  </main>
</div>
</body>
</html>
