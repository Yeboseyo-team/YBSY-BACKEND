<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>새 비밀번호 (PC)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2B55B3}a:hover{color:#1E3F8A}
</style>
</head>
<body>
<div style="min-height: 100vh; display: flex; flex-direction: column; background: #F5F7FA; color: #17233B; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif">
  <header style="width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 32px; box-sizing: border-box; height: 72px; display: flex; align-items: center">
    <a href="PcLogin.html" style="font-size: 18px; font-weight: 700; letter-spacing: -0.02em; color: #17233B; text-decoration: none">학기예보</a>
  </header>
  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px 24px 96px">
    <div style="width: 100%; max-width: 460px; box-sizing: border-box; background: #FFFFFF; border: 1px solid #DCE2EA; border-radius: 24px; padding: 40px; display: flex; flex-direction: column; gap: 24px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.03em">새 비밀번호 정하기</h1>
        <p style="margin: 0; font-size: 15px; line-height: 1.65; color: #4A5872">저장하면 바로 로그인된 상태로 예보 화면이 열려요.</p>
      </div>
      <form style="display: flex; flex-direction: column; gap: 16px">
        <div style="display: flex; flex-direction: column; gap: 8px">
          <label for="pcr-password" style="font-size: 14px; font-weight: 600">새 비밀번호</label>
          <input id="pcr-password" type="password" value="semester" aria-describedby="pcr-rules" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 1.5px solid #3F6FD8; border-radius: 12px; background: #FFFFFF; color: #17233B; font: inherit; font-size: 15px">
          <ul id="pcr-rules" style="list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px">
            <li style="display: flex; align-items: center; gap: 6px; color: #2F5E9E"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>8자 이상 <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">충족</span></li>
            <li style="display: flex; align-items: center; gap: 6px; color: #2F5E9E"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>영문 포함 <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">충족</span></li>
            <li style="display: flex; align-items: center; gap: 6px; color: #5A6780"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="7"></circle></svg>숫자 포함 <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">미충족</span></li>
          </ul>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <label for="pcr-confirm" style="font-size: 14px; font-weight: 600">새 비밀번호 확인</label>
          <input id="pcr-confirm" type="password" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #C9D2DE; border-radius: 12px; background: #FFFFFF; color: #17233B; font: inherit; font-size: 15px">
        </div>
        <a href="index.html" style="height: 50px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: #17233B; color: #FFFFFF; font-size: 15px; font-weight: 600; text-decoration: none">비밀번호 저장</a>
      </form>
    </div>
  </main>
</div>
</body>
</html>
