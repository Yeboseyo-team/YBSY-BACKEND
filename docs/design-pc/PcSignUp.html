<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회원가입 (PC)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2B55B3}a:hover{color:#1E3F8A}
</style>
</head>
<body>
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #F5F7FA; color: #17233B; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif">

  <aside style="flex: 5 1 480px; min-width: 0; background: #17233B; color: #FFFFFF; padding: 48px 56px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; gap: 48px">
    <span style="font-size: 20px; font-weight: 700; letter-spacing: -0.02em">학기예보</span>

    <div style="max-width: 560px; display: flex; flex-direction: column; gap: 18px">
      <p style="margin: 0; font-size: 38px; line-height: 1.3; font-weight: 700; letter-spacing: -0.03em">일정을 더하기 전에,<br>이번 학기 날씨부터 확인하세요.</p>
      <p style="margin: 0; font-size: 17px; line-height: 1.6; color: rgba(255,255,255,0.75)">수업, 활동, 자격증 준비 시간을 주 단위로 더해 바빠지는 주를 미리 알려 드려요.</p>
      <div aria-hidden="true" style="position: relative; height: 220px; margin-top: 28px">
        <div style="position: absolute; inset: 0; display: flex; align-items: flex-end; gap: 6px">
          
            <div style="flex: 1; border-radius: 4px 4px 2px 2px; height: 75px; background: #8DB8F2"></div>
          
            <div style="flex: 1; border-radius: 4px 4px 2px 2px; height: 88px; background: #8DB8F2"></div>
          
            <div style="flex: 1; border-radius: 4px 4px 2px 2px; height: 97px; background: #8DB8F2"></div>
          
            <div style="flex: 1; border-radius: 4px 4px 2px 2px; height: 110px; background: #8DB8F2"></div>
          
            <div style="flex: 1; border-radius: 4px 4px 2px 2px; height: 119px; background: #8DB8F2"></div>
          
            <div style="flex: 1; border-radius: 4px 4px 2px 2px; height: 132px; background: #F2A93B"></div>
          
            <div style="flex: 1; border-radius: 4px 4px 2px 2px; height: 141px; background: #F2A93B"></div>
          
            <div style="flex: 1; border-radius: 4px 4px 2px 2px; height: 192px; background: #E0564E"></div>
          
            <div style="flex: 1; border-radius: 4px 4px 2px 2px; height: 129px; background: #F2A93B"></div>
          
            <div style="flex: 1; border-radius: 4px 4px 2px 2px; height: 113px; background: #8DB8F2"></div>
          
            <div style="flex: 1; border-radius: 4px 4px 2px 2px; height: 123px; background: #8DB8F2"></div>
          
            <div style="flex: 1; border-radius: 4px 4px 2px 2px; height: 135px; background: #F2A93B"></div>
          
            <div style="flex: 1; border-radius: 4px 4px 2px 2px; height: 151px; background: #F2A93B"></div>
          
            <div style="flex: 1; border-radius: 4px 4px 2px 2px; height: 173px; background: #E0564E"></div>
          
            <div style="flex: 1; border-radius: 4px 4px 2px 2px; height: 201px; background: #E0564E"></div>
          
            <div style="flex: 1; border-radius: 4px 4px 2px 2px; height: 94px; background: #8DB8F2"></div>
          
        </div>
        <div style="position: absolute; left: 0; right: 0; bottom: 157px; border-top: 1.5px dashed rgba(255,255,255,0.7)"></div>
        <span style="position: absolute; left: 0; bottom: 163px; font-size: 12px; color: rgba(255,255,255,0.7)">가용 50시간</span>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; color: rgba(255,255,255,0.8)">
        <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 2px; background: #8DB8F2"></span>맑음, 여유</span>
        <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 2px; background: #F2A93B"></span>흐림, 주의</span>
        <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 2px; background: #E0564E"></span>폭풍, 과부하</span>
        <span style="margin-left: auto; color: rgba(255,255,255,0.6)">예시 학기</span>
      </div>
    </div>

    <span style="font-size: 13px; color: rgba(255,255,255,0.55)">학기예보 팀</span>
  </aside>

  <main style="flex: 6 1 420px; min-width: 0; padding: 48px 32px; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
    <div style="width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 18px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">회원가입</h1>
        <p style="margin: 0; font-size: 15px; color: #4A5872">가입하면 내 학기 계획과 자격증 일정을 저장할 수 있어요.</p>
      </div>

      <button type="button" style="height: 50px; border: 1px solid #C9D2DE; border-radius: 12px; background: #FFFFFF; color: #17233B; font: inherit; font-size: 15px; font-weight: 600">Google 계정으로 가입하기</button>

      <div role="separator" style="display: flex; align-items: center; gap: 12px; font-size: 12px; color: #5A6780">
        <span style="flex: 1; height: 1px; background: #DCE2EA"></span>또는 이메일로 가입<span style="flex: 1; height: 1px; background: #DCE2EA"></span>
      </div>

      <form style="display: flex; flex-direction: column; gap: 14px">
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
          <div style="display: flex; flex-direction: column; gap: 6px">
            <label for="pcs-name" style="font-size: 14px; font-weight: 600">이름</label>
            <input id="pcs-name" type="text" value="김민지" style="height: 46px; box-sizing: border-box; padding: 0 14px; border: 1px solid #C9D2DE; border-radius: 12px; background: #FFFFFF; color: #17233B; font: inherit; font-size: 15px">
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px">
            <label for="pcs-email" style="font-size: 14px; font-weight: 600">이메일</label>
            <input id="pcs-email" type="email" value="you@university.ac.kr" style="height: 46px; box-sizing: border-box; padding: 0 14px; border: 1px solid #C9D2DE; border-radius: 12px; background: #FFFFFF; color: #17233B; font: inherit; font-size: 15px">
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="pcs-password" style="font-size: 14px; font-weight: 600">비밀번호</label>
          <input id="pcs-password" type="password" value="hakgi2026" aria-describedby="pcs-password-hint" style="height: 46px; box-sizing: border-box; padding: 0 14px; border: 1px solid #C9D2DE; border-radius: 12px; background: #FFFFFF; color: #17233B; font: inherit; font-size: 15px">
          <span id="pcs-password-hint" style="font-size: 12px; color: #5A6780">8자 이상, 영문과 숫자를 섞어 주세요.</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="pcs-confirm" style="font-size: 14px; font-weight: 600">비밀번호 확인</label>
          <input id="pcs-confirm" type="password" value="hakgi2025" aria-invalid="true" aria-describedby="pcs-confirm-error" style="height: 46px; box-sizing: border-box; padding: 0 14px; border: 1.5px solid #C2362F; border-radius: 12px; background: #FFFFFF; color: #17233B; font: inherit; font-size: 15px">
          <span id="pcs-confirm-error" style="font-size: 12px; color: #A82E27">비밀번호가 일치하지 않습니다.</span>
        </div>
        <label style="display: flex; align-items: flex-start; gap: 10px; padding: 2px 0; font-size: 13px; line-height: 1.5">
          <input type="checkbox" checked="" style="width: 18px; height: 18px; margin: 1px 0 0; flex: none; accent-color: #17233B">
          <span>서비스 이용을 위한 개인정보(이메일, 이름) 수집·이용에 동의합니다. <span style="color: #5A6780">(필수)</span> <a href="PcPrivacy.html">내용 보기</a></span>
        </label>
        <a href="PcCheckEmail.html" style="height: 50px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: #17233B; color: #FFFFFF; font-size: 15px; font-weight: 600; text-decoration: none">가입하기</a>
      </form>

      <p style="margin: 0; text-align: center; font-size: 14px; color: #4A5872">이미 계정이 있나요? <a href="PcLogin.html" style="font-weight: 700">로그인</a></p>
    </div>
  </main>
</div>
</body>
</html>
